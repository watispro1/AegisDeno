app = "aegisdeno"
primary_region = "dfw"

[build]
  dockerfile = 'Dockerfile'

# Persistent disk for AegisDB (WAL + snapshots). Create it once before deploying:
#   fly volumes create aegis_data --region dfw --size 1
# A volume attaches to one machine, so this app runs a single machine.
[mounts]
  source = 'aegis_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
