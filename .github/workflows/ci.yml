name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json

      - run: npm ci

      - name: Version lockstep check
        run: npm run check:versions

      # ESLint lives in tools/lint (own lockfile): typescript-eslint needs the
      # TypeScript 6 API, the app builds with TypeScript 7.
      - name: Install lint tooling
        run: npm run lint:install

      - name: Lint
        run: npm run lint

      - run: npm run typecheck

      # Same as `npm test` (unit tests, build, web smoke test), with coverage.
      # The coverage summary goes to the job summary; there is no threshold.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - run: npm run build

      - name: Smoke test web routes
        run: npx tsx scripts/smoke-web.ts

  deploy:
    name: Deploy to Fly.io
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
